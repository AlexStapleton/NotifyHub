<!doctype html>

<head>

<title>Set up · NotifyHub</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body class="center">
<div class="card login">
  <div class="brand big"><img src="/favicon.svg" alt=""><span>NotifyHub</span></div>
  <p>No password is set yet, so the hub is locked. On the server, run:</p>
  <pre>sudo notify-hub set-password</pre>
  <p class="muted">Then reload this page. Optional but recommended for access from the internet:</p>
  <pre>sudo notify-hub totp-on</pre>
</div>
</body>
</html>
